# TRY003 is intentionally skipped: simple domain errors do not need exception-class
# constructors just to centralize messages.
# The remaining ignores are the current baseline surfaced by Strictify's expanded
# anti-slop profile. Delete these entries as focused cleanup lands.
ignore = [
    "ANN401",
    "PLC0415",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately capture unused returns, assert directly, touch private implementation
# details, use boolean positional helpers, and use high-complexity parameterized setup.
# RUF012: test-only fixture/template dicts don't carry the shared-mutable-state
# risk that motivates ClassVar in production code.
"tests/**/*.py" = ["ANN", "ARG", "C901", "FBT", "F841", "PLR0912", "PLR0913", "PLR0915", "RUF012", "S101", "SLF"]
"**/tests/**/*.py" = ["ANN", "ARG", "C901", "FBT", "F841", "PLR0912", "PLR0913", "PLR0915", "RUF012", "S101", "SLF"]
"scripts/**/*.py" = ["C901", "PLR0912", "PLR0913", "PLR0915", "T20"]
"src/pynchy/agent/agent_runner/src/agent_runner/agent_tools/_server.py" = ["F401"]
"src/pynchy/host/container_manager/ipc/__init__.py" = ["F401"]
"src/pynchy/host/orchestrator/config_jobs.py" = ["C901"]

[tool.ruff.lint.mccabe]
# Strictify's anti-slop profile keeps complexity inside Ruff's normal lint pass.
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

# ─────────────────────────────────────────────────────────────────────────────
# mypy — strict static type checking.
# Introduced in INFORMATIONAL mode: the pre-commit `mypy` hook is non-blocking
# (see .pre-commit-config.yaml). This codebase is largely untyped, so `strict`
# surfaces a ratchet target rather than a gate. Tighten to blocking once the
# baseline is clean.
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
# agent_runner is a separate uv sub-project (own venv, own dependency set) that
# runs inside the agent container, not the host. Its package root is
# src/pynchy/agent/agent_runner/src, so mypy invoked from here can never resolve
# its internal imports correctly regardless of config; it's checked on its own
# via src/pynchy/agent/agent_runner/pyproject.toml's mirrored [tool.mypy].
exclude = "^src/pynchy/agent/agent_runner/"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true
# Pragmatic exceptions for this project's frameworks:
#   no-untyped-def/no-untyped-call — codebase is only partially annotated (ratchet later)
#   attr-defined/union-attr/override — Textual widgets + pluggy hooks use dynamic attrs
#   call-arg — Pydantic model constructors trip false positives
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "attr-defined",
    "union-attr",
    "override",
    "call-arg",
]

# Tests should never block on type strictness (fixtures, mocks, parameterization).
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
ignore_errors = true

# Optional plugin dependencies (see [project.optional-dependencies]): not installed
# in the base dev environment, and none ship type stubs or a `types-*` package.
[[tool.mypy.overrides]]
module = [
    "caldav.*",
    "discord.*",
    "fastmcp.*",
    "jupyter_client.*",
    "neonize.*",
    "playwright.*",
    "slack_bolt.*",
    "ubuntu_namer.*",
]
ignore_missing_imports = true

# Decorator typing for these integrations varies across installed dependency
# metadata, so their decorator ignores must remain portable across environments.
[[tool.mypy.overrides]]
module = [
    "pynchy.plugins.channels.slack._events",
    "pynchy.plugins.integrations.notebook_server.__main__",
]
disable_error_code = ["unused-ignore"]

# ─────────────────────────────────────────────────────────────────────────────
# coverage — ratchet floor set at the measured baseline (68.93%, via
# `uv run pytest --cov=pynchy`). Ratchet this number up as coverage improves —
# never down.
# ─────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pynchy"]
skip_empty = true
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/conftest.py"]

[tool.coverage.report]
fail_under = 68
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

# ─────────────────────────────────────────────────────────────────────────────
# vulture — dead-code detection. Runs informationally (min_confidence 80).
# `ignore_names` covers framework "magic" names: pluggy hooks, Textual handlers,
# Pydantic config/validators.
# ─────────────────────────────────────────────────────────────────────────────
[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
exclude = [".venv/"]
ignore_names = [
    "pynchy_*",      # pluggy hook implementations (hookimpl-decorated)
    "on_*",          # Textual message handlers
    "watch_*",       # Textual reactive watchers
    "action_*",      # Textual action methods
    "compose",       # Textual compose()
    "model_config",  # Pydantic
    "field_validator",
    "model_validator",
]
