[project]
name = "pynchy"
version = "0.1.0"
description = "Personal AI assistant"
readme = "README.md"
requires-python = ">=3.13"
# Do not edit these dependencies manually. Use `uv add` instead.
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "beartype>=0.22.9",
    "croniter>=6.0.0",
    "cryptography>=50.0.0",
    "detect-secrets>=1.5.0",
    "mcp>=1.28.1,<2",
    "pluggy>=1.6.0",
    "pydantic>=2.12.5",
    "pydantic-settings[toml]>=2.9",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "starlette>=1.3.1",
    "structlog>=25.5.0",
    "temporalio>=1.30.0",
    "tomlkit>=0.13",
    "uvicorn>=0.41.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
whatsapp = ["neonize>=0.3.14.post0", "qrcode>=8.2"]
slack = ["slack-bolt>=1.27.0"]
discord = ["discord-py[voice]>=2.7.1"]
caldav = ["caldav>=1.4.0"]
browser = ["playwright"]
all = ["pynchy[whatsapp,slack,discord,caldav,browser,notebook,voice]"]
notebook = [
    "fastmcp>=3.2.0",
    "ipykernel>=6.30",
    "jupyter-client>=8.6",
    "jupyterlab>=4.6.2",
    "nbformat>=5.10",
    "pillow>=12.3.0",
    "ubuntu-namer>=1.1",
]
voice = [
    "faster-whisper>=1.2.1",
]

[project.scripts]
pynchy = "pynchy.__main__:main"
pynchy-whatsapp-auth = "pynchy.__main__:whatsapp_auth"
pynchy-kubernetes-runtime = "pynchy.plugins.runtimes.kubernetes_runtime.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "deptry>=0.25.1",
    "discord-py>=2.4.0",
    "flynt>=1.0.6",
    "freezegun>=1.5.5",
    "mcp>=1.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-include-markdown-plugin>=7.2.1",
    "mkdocs-linkcheck>=1.0.6",
    "mkdocs-material>=9.7.1",
    "mkdocs-minify-plugin>=0.8.0",
    "mypy>=2.1.0",
    "nbformat>=5.10.4",
    "prek>=0.4.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyupgrade>=3.21.2",
    "rich>=14.3.3",
    "ruff>=0.16.0",
    "types-croniter>=6.2.3.20260704",
    "types-pyyaml>=6.0.12.20260518",
    "types-qrcode>=8.2.0.20260518",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pynchy"]

[tool.new-feature]
target_branch = "main"
default_agent = "codex"
push = false
setup = [
    "uv sync --locked",
]
pre_merge = [
    "uv run python scripts/runtime_harness.py stop",
    "uv run python scripts/runtime_harness.py run -- uv run pytest -o addopts='' -n 0 -m runtime",
    # The allocated runtime values are required above, but ordinary unit tests
    # deliberately assert the default host resource names and ports.
    "unset SERVER__PORT GATEWAY__PORT NEW_FEATURE_TEMPORAL_PORT PYNCHY_RUNTIME_NAMESPACE; uvx prek run --all-files",
]
post_merge = [
    "unset SERVER__PORT GATEWAY__PORT NEW_FEATURE_TEMPORAL_PORT PYNCHY_RUNTIME_NAMESPACE; uv run pytest --cov=pynchy --cov-report=term-missing",
    "uv run python scripts/prek_hooks/check_coverage_ratchet.py --update",
    "git add pyproject.toml",
    "unset SERVER__PORT GATEWAY__PORT NEW_FEATURE_TEMPORAL_PORT PYNCHY_RUNTIME_NAMESPACE; uv run --directory src/pynchy/agent/agent_runner --locked pytest",
]
teardown = ["uv run python scripts/runtime_harness.py stop"]

[tool.new-feature.env]
SERVER__PORT = { allocate = "port", min = 18484, max = 18583 }
GATEWAY__PORT = { allocate = "port", min = 14010, max = 14109 }
NEW_FEATURE_TEMPORAL_PORT = { allocate = "port", min = 17233, max = 17332 }
PYNCHY_RUNTIME_NAMESPACE = { allocate = "name", prefix = "pynchy", max_length = 40 }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-n auto --tb=short -q --no-header -m 'not live and not runtime' --durations=0 --durations-min=2.0"
timeout = 30
markers = [
    "action(*ids): semantic action IDs covered by this behavioral test",
    "live: live integration tests that require real service connections (deselected by default)",
    "runtime: deterministic full-stack runtime tests managed by scripts/runtime_harness.py (deselected by default)",
    "parity: channel parity tests — verify output consistency across built-in channels",
]
filterwarnings = [
    # aiohttp request/application types subclass typing.MutableMapping[...] generics
    # (not beartype.typing's PEP 585 form) in aiohttp's own source; see
    # src/pynchy/__init__.py for the full explanation. Not fixable on our side.
    "ignore:.*typing\\.MutableMapping\\[.*:beartype.roar.BeartypeDecorHintPep585DeprecationWarning",
]

# Mirrored in: src/pynchy/agent/agent_runner/pyproject.toml
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

