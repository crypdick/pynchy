# LiteLLM Proxy Configuration — EXAMPLE
# =======================================
# Copy this directory into your private personalization repository and fill in
# the model routes. Secrets remain in Pynchy's root .env file.
# This file is the single source of truth for LLM routing — pynchy reads
# it but never modifies it.
#
# How env vars work:
#   1. Reference API keys with os.environ/VARNAME in this file.
#   2. Set the matching vars in .env.
#   3. At startup pynchy scans this file, finds all os.environ/ references,
#      looks them up on the host, and forwards them into the Docker container.
#
# Key safety: pynchy filters model_list entries at startup. If an api_key's
# env var is unset or contains a placeholder value (e.g. "sk-ant-..."),
# that deployment is silently removed from the config mounted into LiteLLM.
# This prevents zombie deployments from poisoning the router's health state.
#
# To add a second key for load balancing, just add another model_list entry
# with a different os.environ/ var and set that var in .env — no code changes.
#
# Docs: https://docs.litellm.ai/docs/proxy/configs
# Wildcard routing: https://docs.litellm.ai/docs/wildcard_routing
#
# Pynchy discovers this file by convention; no path setting is needed.

# ---------------------------------------------------------------------------
# Model deployments
# ---------------------------------------------------------------------------
# Wildcard routing proxies all models from a provider without listing each
# one individually.
#
# Multiple entries with the same model_name are load-balanced automatically.

model_list:
  # --- Default gpt-5.5 alias via OpenAI Responses API ---
  # Pynchy's default agent.model is "gpt-5.5". Keep this alias pointed at
  # whatever provider you want to be the default for OpenAI/Codex cores.
  - model_name: "gpt-5.5"
    model_info:
      mode: responses
    litellm_params:
      model: "openai/gpt-5.5"
      api_key: os.environ/OPENAI_API_KEY  # pragma: allowlist secret
      budget_duration: 7d
      custom_llm_provider: openai

  # --- OpenAI (default) ---
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY  # pragma: allowlist secret
      budget_duration: 7d
      custom_llm_provider: openai
    model_info:
      id: openai-default

  # --- Codex core via OpenAI Responses API (optional) ---
  # The Codex CLI commonly requests bare model names. Add explicit routes for
  # any Codex model names you ask it to use.
  # - model_name: "gpt-5.1-codex"
  #   model_info:
  #     mode: responses
  #   litellm_params:
  #     model: "openai/gpt-5.1-codex"
  #     api_key: os.environ/OPENAI_API_KEY  # pragma: allowlist secret
  #     budget_duration: 7d
  #     custom_llm_provider: openai

  # --- Codex core via ChatGPT Subscription (optional) ---
  # Requires LiteLLM's ChatGPT provider OAuth setup; see the LiteLLM docs for
  # CHATGPT_TOKEN_DIR / CHATGPT_AUTH_FILE. To use ChatGPT as the default,
  # replace the OpenAI "gpt-5.5" alias above with this alias.
  # - model_name: "gpt-5.5"
  #   model_info:
  #     mode: responses
  #   litellm_params:
  #     model: "chatgpt/gpt-5.5"
  # - model_name: "chatgpt/gpt-5.3-codex"
  #   model_info:
  #     mode: responses
  #   litellm_params:
  #     model: "chatgpt/gpt-5.3-codex"
  # - model_name: "gpt-5.3-codex-spark"
  #   model_info:
  #     mode: responses
  #   litellm_params:
  #     model: "chatgpt/gpt-5.3-codex-spark"

  # --- Anthropic API key (optional) ---
  # - model_name: "anthropic/*"
  #   litellm_params:
  #     model: "anthropic/*"
  #     api_key: os.environ/ANTHROPIC_API_KEY  # pragma: allowlist secret
  #     budget_duration: 7d
  #     custom_llm_provider: anthropic
  #   model_info:
  #     id: anthropic-api-key

# ---------------------------------------------------------------------------
# Observability / conversation history
# ---------------------------------------------------------------------------
# Phoenix is the source of truth for LLM request/response traces. When this
# callback is enabled, Pynchy requires PHOENIX_COLLECTOR_HTTP_ENDPOINT and
# forwards Phoenix/OTel env vars into the LiteLLM container at startup.
litellm_settings:
  callbacks: ["arize_phoenix"]

# ---------------------------------------------------------------------------
# Router settings  —  routing and cooldown tuning
# ---------------------------------------------------------------------------
# See the litellm-diagnostics reference for detailed rationale.
router_settings:
  # How to distribute requests across deployments with the same model_name.
  # Options: simple-shuffle, least-busy, usage-based-routing,
  #          latency-based-routing, cost-based-routing
  routing_strategy: usage-based-routing

  # Retries provide failover only when a model_name has multiple deployments.
  # This example starts with one deployment per model_name, so repeated router
  # attempts would call the same upstream. Increase this after adding an
  # alternate deployment to a model group.
  num_retries: 0
  timeout: 300

  # Leave allowed_fails unset. LiteLLM's topology-aware cooldown policy avoids
  # removing the only deployment for a retryable transient failure while still
  # isolating unhealthy deployments when the failure or topology warrants it.
  # A fixed allowed_fails threshold opts out of that single-route protection.
  #
  # cooldown_time controls how long a deployment stays unavailable after the
  # router decides to cool it; it does not decide which failures trigger one.
  # Ten minutes avoids per-request churn on a deployment known to be unusable.
  cooldown_time: 600

  # Provider-level budget caps (combined across all keys for that provider).
  # Requires the PostgreSQL sidecar (started automatically by pynchy).
  # For per-key budgets, use max_budget in litellm_params above.
  #
  # provider_budget_config:
  #   anthropic:
  #     budget_limit: 200.0   # USD
  #     time_period: 30d
  #   openai:
  #     budget_limit: 50.0
  #     time_period: 30d

# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------
general_settings:
  # Master key is set as GATEWAY__MASTER_KEY in Pynchy's root .env.
  # Do NOT hardcode it here.
  master_key: os.environ/LITELLM_MASTER_KEY

  # Max parallel requests across all models
  global_max_parallel_requests: 50

  # Public routes: Make routes accessible without auth
  # Only use this if LiteLLM is behind a secure network (e.g., Tailnet, VPN).
  # This allows the UI dashboard and API to be accessed without auth tokens.
  #
  # public_routes:
  #   - "/*"  # All routes public (only use on private networks!)

  # UI credentials are set in .env (GATEWAY__UI_PASSWORD) and pynchy.toml
  # (gateway.ui_username). Pynchy passes them to LiteLLM as UI_USERNAME
  # and UI_PASSWORD env vars.

# ---------------------------------------------------------------------------
# MCP gateway
# ---------------------------------------------------------------------------
# LiteLLM acts as the MCP gateway when MCP-backed tools are selected by profiles.
# Pynchy registers MCP endpoints and creates per-workspace teams via the
# LiteLLM HTTP API at boot. No additional configuration needed here —
# just ensure LiteLLM supports MCP routing (v1.55+).
