# ============================================================================
# Pynchy Personalization — EXAMPLE
# ============================================================================
# Copy this directory into a private repository, then check that repository out
# at data/personalization/.
#
# Public defaults from data/defaults/pynchy.toml are inherited and can be omitted.
# Environment variables override TOML values using __ as the nested delimiter:
#   AGENT__DEFAULT_CORE=codex  →  [agent] default_core = "codex"
# ============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Agent Configuration
# ─────────────────────────────────────────────────────────────────────────────

[agent]
# Agent core: "openai" (default), "claude", "claude-cli", or "codex"
# default_core = "openai"
# Model names must match a route in litellm.yaml.
# model = "gpt-5.6-terra"
# Codex CLI only. The selected model and account must support the effort.
# model_reasoning_effort = "ultra"

# Prompt IDs are scoped paths without .md. Create new IDs under
# prompts/souls/, prompts/executors/, or prompts/reviewers/; defaults cannot
# be shadowed.
# [prompts]
# default_soul = "souls/my-soul"
# default_executor = "executors/my-executor"
# default_pipeline = "my-pipeline"

# Exact, case-insensitive commands that freeze unfinished work for later resumption.
# [commands.pause]
# aliases = ["stop", "pause"]

# ─────────────────────────────────────────────────────────────────────────────
# API Credentials
# ─────────────────────────────────────────────────────────────────────────────
# Secrets (API keys, tokens, passwords) belong in .env, not here.
# See config-examples/.env.EXAMPLE for the template.
#
# For the Codex core, configure a Codex-capable model in litellm.yaml.
# Pynchy routes Codex CLI model traffic through the gateway, not host Codex auth.

# ─────────────────────────────────────────────────────────────────────────────
# Container Configuration
# ─────────────────────────────────────────────────────────────────────────────

[container]
# Container image name (built via ./container/build.sh)
# image = "pynchy-agent:latest"

# Maximum silence within an active query, in milliseconds (30 minutes default).
# Structured output refreshes the deadline; a 4x hard ceiling remains.
# timeout_ms = 1800000

# Per-container memory limit in MiB (2048 default and hard maximum). Pynchy's
# test suite scales pytest-xdist workers to the effective cgroup memory limit.
# memory_mb = 2048

# Idle timeout in milliseconds (15 minutes default)
# idle_timeout_ms = 900000

# Age threshold before unowned running/paused agent containers are reaped
# orphan_reap_age_ms = 604800000

# Maximum concurrent agent containers
# max_concurrent = 5

# Override container runtime detection (usually auto-detected)
# Options: "docker" (built-in), "apple" (requires Apple runtime plugin)
# runtime = "docker"

# ─────────────────────────────────────────────────────────────────────────────
# Server Configuration
# ─────────────────────────────────────────────────────────────────────────────

[server]
# HTTP server port for diagnostics, webhooks, and deployment
# port = 8484

# ─────────────────────────────────────────────────────────────────────────────
# Gateway Configuration (LiteLLM)
# ─────────────────────────────────────────────────────────────────────────────
# LLM API gateway provides credential isolation for containers.
# Pynchy discovers this repository's litellm.yaml by convention.

[gateway]
# API keys are referenced via os.environ/ in the YAML
# and set in .env — pynchy forwards them into the LiteLLM container.

# Gateway port
# port = 4000

# LiteLLM master key and UI credentials → set in .env (see .env.EXAMPLE):
#   GATEWAY__MASTER_KEY, GATEWAY__UI_PASSWORD

# LiteLLM Docker images (usually keep defaults)
# litellm_image = "ghcr.io/berriai/litellm@sha256:9c1f1889774a973ce650f712ace6753a9b6dd1182d25d837b858dbcac6ea3056"
# postgres_image = "postgres:17-alpine"

# ─────────────────────────────────────────────────────────────────────────────
# Scheduler & Intervals
# ─────────────────────────────────────────────────────────────────────────────

[scheduler]
# Poll interval for scheduled tasks (seconds)
# poll_interval = 60.0

# Timezone for scheduled tasks (auto-detected from system if empty)
# timezone = "America/New_York"

# Temporal service used for scheduled agent task workflows
# temporal_address = "localhost:7233"
# temporal_namespace = "default"
# temporal_task_queue = "pynchy-scheduler"

# Built-in maintenance schedule cadence (seconds)
# git_sync_interval_seconds = 300
# channel_reconciliation_interval_seconds = 300

# Keep new repository revisions pending until an admin approves the update.
# Set true to pull and deploy eligible source changes automatically.
# auto_deploy = false

[intervals]
# Message polling interval (seconds)
# message_poll = 2.0

# IPC file polling interval (seconds)
# ipc_poll = 1.0

# Put host jobs in separate automations/<name>/config.toml files.

# ─────────────────────────────────────────────────────────────────────────────
# Queue Configuration
# ─────────────────────────────────────────────────────────────────────────────

[queue]
# max_retries = 5
# base_retry_seconds = 5.0

# ─────────────────────────────────────────────────────────────────────────────
# Automatic Learning
# ─────────────────────────────────────────────────────────────────────────────
# When enabled, pynchy mounts an Obsidian vault into learning-enabled agent
# containers and runs a hidden post-turn reviewer after successful turns.
#
# [learning]
# enabled = false
# review_after_turn = true
# max_attempts = 3
# packet_max_chars = 12000
#
# [learning.obsidian]
# vault_root = "/path/to/obsidian/vault"
# mount_path = "/workspace/vault"
# default_profile_root = "systems/pynchy/profiles/{profile}"
# memory_dir_name = "memory"

# ─────────────────────────────────────────────────────────────────────────────
# Command Center
# ─────────────────────────────────────────────────────────────────────────────
# The command center is the dedicated, pynchy-managed connection used for
# auto-creating chats when no concrete chat binding exists.

[command_center]
# connection = "synapse"

# ─────────────────────────────────────────────────────────────────────────────
# Connections
# ─────────────────────────────────────────────────────────────────────────────
# Define which external connections pynchy is allowed to use.

# [connections.synapse]
# type = "discord"
# bot_token_env = "DISCORD_BOT_TOKEN"
# application_id = "123456789012345678"

# Optional read-only aggregate metadata from personal messaging collectors.
# Pynchy reads timestamps and collector state only, never senders or bodies.
# [messaging_source_health]
# data_dir = "/path/to/host-local/messaging-metadata"
# stale_after_hours = 24

# ─────────────────────────────────────────────────────────────────────────────
# Plugin Overrides
# ─────────────────────────────────────────────────────────────────────────────
# Built-in plugins are auto-loaded from the monorepo. Use [plugins.<key>] to
# disable a specific built-in plugin:
#
# [plugins.whatsapp]
# enabled = false

# ─────────────────────────────────────────────────────────────────────────────
# Profiles and Jobs
# ─────────────────────────────────────────────────────────────────────────────
# Profiles compose with `includes = [...]`; workspaces select profiles by name.
# List fields (skills, tools, repo) are unioned in composition order.
# Scalar fields such as model use later-profile-wins semantics. A workspace-level
# model overrides its resolved profile model and the global [agent] model.

# [profiles.pynchy-admin]
# skills = ["core", "ops"]
# tools = ["browser"]
# repo = ["crypdick/pynchy"]
# is_admin = true
# contains_secrets = true  # pragma: allowlist secret
# model = "chatgpt/gpt-5.3-codex"
#
# Semantic capability rules target a specific tool surface.
# [profiles.pynchy-admin.capabilities."mcp.email.send"]
# decision = "needs_human"  # "allow", "deny", or "needs_human"

# Reuse an explicit no-prompt computer-use grant across profiles.
# [tools.computer_use]
# type = "builtin"
# name = "computer_use"
#
# [profiles.unrestricted-computer-use]
# tools = ["computer_use"]
#
# [profiles.unrestricted-computer-use.capabilities."desktop.computer.use"]
# decision = "allow"
#
# [profiles.desktop-worker]
# includes = ["pynchy-worker", "unrestricted-computer-use"]

# [profiles.pynchy-worker]
# skills = ["core"]
# tools = []
# repo = ["crypdick/pynchy"]
# is_admin = false
# contains_secrets = false  # pragma: allowlist secret

# Each workspaces/<name>.toml file selects profiles, a soul, and a pipeline.

# CLEAN ROOM POLICY: Admin workspaces cannot select tools with public_source = true.
# Tools default to public_source = true unless configured otherwise.
# Pynchy refuses to start if this constraint is violated.
# See: docs/usage/security.md#admin-clean-room

# Example profile with Google MCP tool names:
# [profiles.mycompany-worker]
# tools = ["gdrive.mycompany", "gcal.mycompany"]
# contains_secrets = true  # pragma: allowlist secret

# [tools."gdrive.mycompany"]
# type = "mcp"
# public_source = false
# [tools."gdrive.mycompany".mcp]
# runtime = "docker"
# image = "pynchy-mcp-gdrive:latest"
# port = 3000
#
# [tools."gcal.mycompany"]
# type = "mcp"
# public_source = false
# [tools."gcal.mycompany".mcp]
# runtime = "docker"
# image = "pynchy-mcp-gcal:latest"
# port = 3000

# A workspaces/research.toml file can select this profile.

# Host-only Google Workspace actions through Gog. Gog's OAuth home and client
# credentials stay on the host and are never mounted into agent containers.
# [plugins.gog.options]
# account = "you@example.com"
# home = "data/gog"
# oauth_client_path = "data/google/gog-oauth-client.json"
#
# [tools.gog]
# type = "builtin"
# public_source = true
# secret_data = true  # pragma: allowlist secret
# public_sink = true
# dangerous_writes = true
#
# [profiles.google-workspace]
# tools = ["gog"]
# contains_secrets = true  # pragma: allowlist secret

# Define scheduled work in one automations/<name>/config.toml file per automation.
# See automations/weekly-review/config.toml for the versioned document format.

# ─────────────────────────────────────────────────────────────────────────────
# Command Words (magic commands)
# ─────────────────────────────────────────────────────────────────────────────
# Customize the words that trigger special commands.

# [commands.reset]
# verbs = ["reset", "restart", "clear", "new", "wipe"]
# nouns = ["context", "session", "chat", "conversation"]
# aliases = ["boom", "c"]

# [commands.end_session]
# verbs = ["end", "stop", "close", "finish"]
# nouns = ["session"]
# aliases = ["done", "bye", "goodbye", "cya"]

# [commands.redeploy]
# aliases = ["r"]
# verbs = ["redeploy", "deploy"]

# ─────────────────────────────────────────────────────────────────────────────
# Slack Channel (built-in plugin)
# ─────────────────────────────────────────────────────────────────────────────
# Connects to Slack via Socket Mode. Each Slack channel/DM maps to a pynchy
# workspace with JID "slack:<CHANNEL_ID>". Activates when tokens are set.
#
# Gotcha: Auto-created workspace channels won't appear in your Slack sidebar
# automatically. Search for the channel name in Slack and join it manually.

# Slack tokens → set in .env (see .env.EXAMPLE):
#   SLACK__BOT_TOKEN, SLACK__APP_TOKEN

# ─────────────────────────────────────────────────────────────────────────────
# CalDAV (Calendar)
# ─────────────────────────────────────────────────────────────────────────────
# Built-in host-side plugin. Connects to CalDAV servers (Nextcloud, etc.)
# and exposes list_calendars, list_calendar, create_event, delete_event tools.
# Multiple servers with separate credentials are supported. Calendar names
# are auto-discovered from each server.
#
# Agents reference calendars as "server/calendar_name" or just "calendar_name"
# (resolved against the default server). "primary" maps to default_calendar.

# [tools.caldav]
# type = "caldav"
# default_server = "work"  # which server when no prefix given
# public_source = false
# secret_data = false  # pragma: allowlist secret
# public_sink = false
# dangerous_writes = false

# [tools.caldav.servers.work]
# url = "https://work.nextcloud.com/remote.php/dav/"
# username = "user@work.com"
# password_env = "CALDAV_WORK_PASSWORD"  # env var in .env; see config-examples/.env.EXAMPLE  # pragma: allowlist secret
# default_calendar = "meetings"    # optional: what "primary" resolves to
# allow = ["meetings", "standup"]  # optional: only expose these calendars
# ignore = ["trash"]               # optional: hide these (ignored if allow is set)

# [tools.caldav.servers.personal]
# url = "https://personal.nextcloud.com/remote.php/dav/"
# username = "me@example.com"
# password_env = "CALDAV_PERSONAL_PASSWORD"  # pragma: allowlist secret
# ignore = ["contact_birthdays"]   # hide auto-generated calendars

# ─────────────────────────────────────────────────────────────────────────────
# Chrome Profiles
# ─────────────────────────────────────────────────────────────────────────────
# Generic list of profile names. MCP-backed Google tools can attach to a chrome profile.
# Each profile maps to a host directory at data/chrome-profiles/{name}/.
# Auth artifacts (OAuth keys, tokens) are stored there and auto-mounted into
# containers that reference the profile.

# chrome_profiles = ["mycompany", "work"]

# ─────────────────────────────────────────────────────────────────────────────
# Tool Definitions
# ─────────────────────────────────────────────────────────────────────────────
# Define tools that profiles can select. The security policy reads the trust
# fields from selected tools. See docs/usage/security.md for details.
# For a complete tool-owned credential and companion-skill example, see
# config-examples/tool-access.toml and docs/usage/tool-access.md.
#
# Properties:
#   public_source     — Can this service deliver content from untrusted parties?
#   secret_data       — Would leaking this data cause harm?
#   public_sink       — Can this service send data to untrusted parties?
#   dangerous_writes  — Are writes irreversible or high-impact?
#
# Values: false (safe), true (risky — gated), "forbidden" (blocked entirely)
#
# Tools default to all-true (maximum gating). Set fields to false only when the
# property does not apply.

# Built-in browser-like tool:
# [tools.playwright]
# type = "mcp"
# public_source = true
# secret_data = false  # pragma: allowlist secret
# public_sink = true
# dangerous_writes = true
# [tools.playwright.mcp]
# runtime = "docker"
# image = "mcr.microsoft.com/playwright/mcp:latest"
# port = 8931

# Personal calendar (fully trusted, no gating):
# [tools.caldav]
# type = "builtin"
# name = "caldav"
# public_source = false
# secret_data = false  # pragma: allowlist secret
# public_sink = false
# dangerous_writes = false

# Corporate Slack (untrusted input, sensitive data, can send messages):
# [tools.slack_mcp_acme]
# type = "mcp"
# public_source = true
# secret_data = true  # pragma: allowlist secret
# public_sink = true
# dangerous_writes = true
# [tools.slack_mcp_acme.mcp]
# runtime = "docker"
# image = "ghcr.io/korotovsky/slack-mcp-server:latest"
# port = 8080

# Google Drive (sensitive corporate data, controlled source):
# [tools."gdrive.mycompany"]
# type = "mcp"
# public_source = false
# secret_data = true  # pragma: allowlist secret
# public_sink = false
# dangerous_writes = false
# [tools."gdrive.mycompany".mcp]
# runtime = "docker"
# image = "pynchy-mcp-gdrive:latest"
# port = 3000

# ─────────────────────────────────────────────────────────────────────────────
# Mount Security
# ─────────────────────────────────────────────────────────────────────────────
# Default blocked patterns for mount security. These are merged with patterns
# from the mount-allowlist.toml file.

# [security]
# cop_model = "gpt-5.3-codex-spark" # Optional dedicated LiteLLM route for Cop inspection
# cop_wire_api = "responses"         # Use for LiteLLM routes with mode: responses
# blocked_patterns = [".ssh", ".gnupg", ".gpg", ".aws", ...]

# ─────────────────────────────────────────────────────────────────────────────
# Profiles (reusable workspace config bundles)
# ─────────────────────────────────────────────────────────────────────────────
# Profiles bundle skills, tools, repos, and reusable model choices. Workspace
# files select profiles and may set `model` for a local override.
#
# List fields (skills, tools, repo) are unioned across profiles.
# Scalar fields such as model use later-profile-wins semantics before a workspace
# model override takes precedence.
#
# [profiles.pynchy-dev]
# skills = ["core", "ops"]
# tools = ["playwright"]
# repo = ["owner/repo"]
# model = "chatgpt/gpt-5.3-codex"

# [profiles.ray-bench]
# repo = ["owner/ray-bench"]
# tools = ["notebook"]
