apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: pynchy
imagePullSecrets:
  - name: pynchy-ghcr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pynchy-release-monitor
  namespace: pynchy
automountServiceAccountToken: true
imagePullSecrets:
  - name: pynchy-ghcr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pynchy-release-monitor
  namespace: pynchy
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pynchy-release-monitor
  namespace: pynchy
subjects:
  - kind: ServiceAccount
    name: pynchy-release-monitor
    namespace: pynchy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pynchy-release-monitor
