apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - temporal.yaml
  - vaultwarden.yaml
  - pynchy.yaml
  - desktop.yaml
  - network-policy.yaml
  - release-monitor.yaml
configMapGenerator:
  - name: pynchy-release-monitor
    namespace: pynchy
    files:
      - release-monitor.sh
generatorOptions:
  disableNameSuffixHash: true
