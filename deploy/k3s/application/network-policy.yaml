apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pynchy-ingress
  namespace: pynchy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [pynchy-vaultwarden]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pynchy-web-ingress
  namespace: pynchy
spec:
  podSelector:
    matchLabels:
      app: pynchy
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8485
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pynchy-vaultwarden-ingress
  namespace: pynchy
spec:
  podSelector:
    matchLabels:
      app: pynchy-vaultwarden
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pynchy
      ports:
        - protocol: TCP
          port: 8080
