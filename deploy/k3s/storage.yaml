apiVersion: v1
kind: PersistentVolume
metadata:
  name: pynchy-data-dcloud
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pynchy-local
  local:
    path: /mnt/tank-20/appdata/pynchy-k3s/shared
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [dcloud]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pynchy-data
  namespace: pynchy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: pynchy-local
  volumeName: pynchy-data-dcloud
  resources:
    requests:
      storage: 100Gi
---
