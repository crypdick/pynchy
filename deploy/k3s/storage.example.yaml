apiVersion: v1
kind: PersistentVolume
metadata:
  name: pynchy-data-local
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pynchy-local
  local:
    path: /var/lib/pynchy-k3s/shared
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [pynchy-node]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pynchy-data
  namespace: pynchy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: pynchy-local
  volumeName: pynchy-data-local
  resources:
    requests:
      storage: 100Gi
