    "TRY004",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY400",
    "TRY401",
    "UP",
    "W",
    "YTT",
]
# Ruff 0.16 preview migrations; keep standard noqa comments and rule-code policy
# selectors until a focused readability migration can review them together.
ignore = ["RUF105", "RUF201"]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "C901", "FBT", "F841", "INP", "PLR0912", "PLR0913", "PLR0915", "RUF012", "S101", "SLF"]
# The outer project directory stays non-package so pytest does not import the
# standalone runner through the surrounding host Pynchy package.
"src/agent_runner/__init__.py" = ["INP"]
"src/agent_runner/agent_tools/_server.py" = ["F401"]

[tool.ruff.lint.mccabe]
# Strictify's anti-slop profile keeps complexity inside Ruff's normal lint pass.
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

[tool.deptry]
known_first_party = ["agent_runner"]
package_module_name_map = { "openai-agents" = "agents" }

[tool.pytest.ini_options]
# Keep this nested project and its tests out of Python packages. Otherwise
# pytest imports them through the surrounding host ``pynchy.agent`` package and
# couples the standalone runner suite to host-only dependencies.
testpaths = ["tests"]
asyncio_mode = "strict"

# Mirrored from: pyproject.toml (root)
[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true


[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
ignore_errors = true
