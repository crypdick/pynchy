    "ANN204",
    "ANN401",
    "BLE001",
    "FBT001",
    "PLC0415",
    "PLC2701",
    "PLR0913",
    "PLW0603",
    "PLW0717",
    "RUF029",
    "RUF067",
    "S101",
    "S404",
    "S603",
    "S607",
    "SLF001",
    "TC001",
    "TC003",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "C901", "FBT", "F841", "PLR0912", "PLR0913", "PLR0915", "RUF012", "S101", "SLF"]
"src/agent_runner/agent_tools/_server.py" = ["F401"]

[tool.ruff.lint.mccabe]
# Strictify's anti-slop profile keeps complexity inside Ruff's normal lint pass.
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

# Mirrored from: pyproject.toml (root)
[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "attr-defined",
    "union-attr",
    "override",
    "call-arg",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
ignore_errors = true
