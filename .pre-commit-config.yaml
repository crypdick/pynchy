# Run with: uvx pre-commit run --all-files
# Install hooks: uvx pre-commit install
repos:
  # Ruff: linting + formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-case-conflict
      - id: debug-statements

  # Detect secrets/credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: uv\.lock

  # Syntax modernization (auto-fix, blocking: re-stage and re-commit if it edits files)
  - repo: local
    hooks:
      - id: fix-future-annotations
        name: Fix 'from __future__ import annotations' placement
        entry: uv run python scripts/pre_commit_hooks/fix_future_annotations.py
        language: system
        types: [python]
      - id: pyupgrade
        name: Upgrade syntax to target Python version
        entry: uv run pyupgrade --py313-plus
        language: system
        types: [python]
      - id: flynt
        name: Convert to f-strings
        entry: uv run flynt --line-length=100
        language: system
        types: [python]

  # Custom blocking lint checks (see AGENTS.md for the '# allow: <hook-name>' exemption convention)
  - repo: local
    hooks:
      - id: check-print-statements
        name: Ban print() in favor of structured logging
        entry: uv run python scripts/pre_commit_hooks/check_print_statements.py
        language: system
        types: [python]
      - id: check-exception-handling
        name: Ban bare/broad exception handling
        entry: uv run python scripts/pre_commit_hooks/check_exception_handling.py
        language: system
        types: [python]
      - id: check-file-length
        name: Enforce 400-logical-line file budget
        entry: uv run python scripts/pre_commit_hooks/check_file_length.py
        language: system
        types: [python]
        files: ^src/
      - id: vulture
        name: Detect dead code
        entry: uv run vulture src tests --min-confidence 80
        language: system
        pass_filenames: false
        types: [python]
      - id: xenon
        name: Check cyclomatic complexity
        entry: uv run xenon --max-absolute C --max-modules C --max-average B src
        language: system
        pass_filenames: false
        types: [python]
      - id: check-timeless-comments
        name: Flag temporal language in comments (legacy/old/refactor/...)
        entry: uv run python scripts/pre_commit_hooks/check_timeless_comments.py
        language: system
        types: [python]
        files: ^src/
      - id: check-private-test-imports
        name: Flag tests importing private first-party symbols
        entry: uv run python scripts/pre_commit_hooks/check_private_test_imports.py
        language: system
        types: [python]
        files: ^tests/

  # Informational-only gates (pragmatic ratchet): report violations without
  # blocking commits. Existing debt in these categories has not been audited
  # or fixed yet, so `|| true` keeps them non-blocking until it has been.
  - repo: local
    hooks:
      - id: mypy
        name: "[informational] Strict type check"
        entry: bash -c 'uv run mypy src tests || true'
        language: system
        pass_filenames: false
        types: [python]
        verbose: true

  # Documentation link validation
  - repo: local
    hooks:
      - id: mkdocs-linkcheck
        name: Check documentation links
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|mkdocs\.yml)

  # Tests
  - repo: local
    hooks:
      - id: pytest
        name: Run tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        files: ^(src/|tests/)
