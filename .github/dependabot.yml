version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: uv
    directory: /src/pynchy/agent/agent_runner
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
