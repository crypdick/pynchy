name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Tests only read repository contents; keep the workflow token read-only.
permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Check architecture boundaries
        run: uv run prek run check-architecture-boundaries --all-files
      - name: Check semantic action coverage
        run: uv run python scripts/prek_hooks/check_action_coverage.py
      - name: Run Python tests
        run: uv run pytest --cov=pynchy --cov-report=term-missing
      - name: Install agent-runner test dependencies
        run: uv sync --project src/pynchy/agent/agent_runner --locked --all-groups
      - name: Run agent-runner tests
        run: uv run --directory src/pynchy/agent/agent_runner --locked pytest

  runtime:
    name: Deterministic runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Provision deterministic runtime dependencies
        run: |
          uv run python scripts/install_new_feature_dependencies.py \
            --runtime-only \
            --bin-dir "$RUNNER_TEMP/pynchy-runtime-bin"
          echo "$RUNNER_TEMP/pynchy-runtime-bin" >> "$GITHUB_PATH"
      - name: Run deterministic runtime integration tests
        run: |
          uv run python scripts/runtime_harness.py run -- \
            uv run pytest -o addopts='' -n 0 -m runtime
      - name: Stop deterministic runtime
        if: always()
        continue-on-error: true
        run: uv run python scripts/runtime_harness.py stop
      - name: Upload deterministic runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-runtime-diagnostics
          path: |
            logs/pynchy-runtime/
            data/messages.db
            data/temporal.db
          if-no-files-found: ignore

  release-images:
    name: Publish release images
    if: github.event_name == 'push'
    needs: [test, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test release images
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          host_image="ghcr.io/$owner/pynchy-host:$RELEASE_SHA"
          agent_image="ghcr.io/$owner/pynchy-agent:$RELEASE_SHA"
          docker build \
            --build-arg "PYNCHY_RELEASE_SHA=$RELEASE_SHA" \
            -f deploy/k3s/host.Dockerfile \
            -t "$host_image" \
            .
          docker run --rm --entrypoint /opt/pynchy/.venv/bin/python \
            "$host_image" -c 'import pynchy'
          docker run --rm --entrypoint /usr/local/bin/uvx \
            "$host_image" --version
          # Deployment-specific plugin requirements are generated outside Git.
          touch src/pynchy/agent/requirements-plugins.txt
          docker build \
            --build-arg AGENT_UID=3000 \
            --build-arg AGENT_GID=3000 \
            -t "$agent_image" \
            src/pynchy/agent
          docker run --rm --entrypoint python "$agent_image" -c 'import agent_runner.agent_tools'
          docker push "$host_image"
          docker push "$agent_image"
