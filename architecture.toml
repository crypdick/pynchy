version = 2
default_violation_guidance = "Move the shared semantic contract inward or inject a narrow capability from a named composition root."

source_roots = [
  { path = "src/pynchy", module = "pynchy", exclude = ["agent/agent_runner/**"] },
  { path = "src/pynchy/agent/agent_runner/src/agent_runner", module = "agent_runner" },
]

# Only these modules may select and wire private concrete implementations.
composition_roots = [
  "pynchy.__main__",
  "pynchy.host.orchestrator.app",
  "pynchy.host.orchestrator.dep_factory",
  "pynchy.host.orchestrator.lifecycle",
  "pynchy.host.orchestrator.source_health_deps",
  "pynchy.host.orchestrator.terminal_task_retirement",
]

[roles.foundation]
allowed_dependencies = []
violation_guidance = "Foundation code must not depend outward; move the required stable contract into foundation or domain."

[roles.domain]
allowed_dependencies = ["foundation"]
violation_guidance = "Move the shared semantic type or invariant into the domain role without importing outward behavior."

[roles.extension_api]
allowed_dependencies = ["domain", "foundation"]
violation_guidance = "Depend on the inward-facing plugin contract, or move the missing extension contract into this role."

[roles.ports]
allowed_dependencies = ["domain", "extension_api", "foundation"]
violation_guidance = "Depend on a use-case-owned port and wire its concrete implementation in a named composition root."

[roles.config]
allowed_dependencies = ["domain", "extension_api", "foundation"]
violation_guidance = "Inject only the resolved configuration values the importer needs from a named composition root."

[roles.application]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports", "state_adapter"]
violation_guidance = "Introduce or narrow a use-case-owned port instead of importing a private application implementation."

[roles.state_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the declared state API or a use-case-owned persistence port when transaction ownership requires inversion."

[roles.container_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use a use-case-owned execution capability and wire this adapter at composition."

[roles.driving_adapter]
allowed_dependencies = ["application", "domain", "extension_api", "foundation", "ports"]
violation_guidance = "Invoke an application-owned inbound API; do not reach into private application modules."

[roles.git_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use a use-case-owned source-control port and wire the Git implementation at composition."

[roles.learning_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use a use-case-owned learning capability and wire the concrete adapter at composition."

[roles.host_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use a use-case-owned host capability and wire the concrete adapter at composition."

[roles.integration_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use an integration-neutral application port instead of importing another concrete adapter."

[roles.memory_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the plugin memory contract and select the concrete provider at composition."

[roles.observer_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the plugin observer contract and select the concrete observer at composition."

[roles.runtime_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the runtime provider contract and select the platform adapter at composition."

[roles.speech_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the plugin speech contract and select the concrete synthesizer at composition."

[roles.tunnel_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the plugin tunnel contract and select the concrete tunnel provider at composition."

[roles.agent_core_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the agent-core plugin contract and select the concrete provider at composition."

[roles.computer_use_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Use the computer-use contract and select the concrete backend at composition."

[roles.canary_adapter]
allowed_dependencies = ["domain", "extension_api", "foundation", "ports"]
violation_guidance = "Inject the canary's required capabilities instead of importing concrete operational adapters."

[roles.agent_assets]
allowed_dependencies = ["foundation"]

[roles.agent_runner]
allowed_dependencies = []
violation_guidance = "Cross this separate runtime only through its serialized input and output wire contract."

# A package owns its root and descendants unless a more-specific package owns
# them. Public modules use an exact allowlist; omission never makes a new module
# public. The two source-root packages opt out of descendant ownership so new
# top-level modules cannot inherit a role accidentally. Existing public modules
# record migration state; each multi-module package converges on one <root>.api.

[[packages]]
name = "agent_runner"
root = "agent_runner"
role = "agent_runner"
public_modules = []

